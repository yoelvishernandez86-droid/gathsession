<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GathSession</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script type="module" src="/main.js"></script>
    <div class="page">
      <header>
        <a href="" class="logo">
          <img src="./assets/GathSession..svg" alt="GathSession logo" />
        </a>
        <nav class="header">
          <ul class="header_navigation">
            <li><a href="" class="active">Home</a></li>
            <li><a href="">Features</a></li>
            <li><a href="">Blog</a></li>
            <li><a href="">Contact</a></li>
            <li><a href="">About Us</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <section class="hero">
          <h1 class="hero_tittle">
            Build your best community starting from here.
          </h1>
          <p hero_description>
            Meet and communicate with the best people to run projects, events or
            other activities in a more effective and fun way
          </p>
          <a href="" class="Get_started button">Get Started</a>
          <a href="" class="Learn_more">Learn More</a>
        </section>
        <div class="gallery">
          <img src="./assets/black_man_orange.png" alt="" class="image1" />
          <img src="./assets/preety_woman_smiling.png" alt="" class="image2" />
          <img src="./assets/black_pretty_lady.png" alt="" class="image3" />
          <img src="./assets/red_hair_lady.png" alt="" class="image4" />
          <img src="./assets/positive_man.png" alt="" class="image5" />
        </div>
        <section class="cards">
          <article class="community">
            <img src="./assets/Comments.svg" alt="" />
            <h2>Build Community</h2>
          </article>
          <article class="events">
            <img src="./assets/Post.svg" alt="" />
            <h2>Share Events</h2>
          </article>
          <article class="information">
            <img src="./assets/Week Schedule.svg" alt="" />
            <h2>Get Information</h2>
          </article>
        </section>
      </main>
      <footer></footer>
    </div>
  </body>
</html>
